<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparison Matrix | XR Guide</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --primary: #FF8C00;
            --bg: #0a0a0b;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }
        body {
            background: var(--bg);
            color: #eee;
            font-family: 'Sarabun', 'Outfit', sans-serif;
            line-height: 1.8;
            margin: 0;
            padding: 0;
        }
        .nav-header {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .back-btn {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }
        .container {
            max-width: 900px;
            margin: 60px auto;
            padding: 0 20px;
        }
        #content {
            background: var(--card-bg);
            padding: 60px;
            border-radius: 40px;
            border: 1px solid var(--border);
        }
        /* Markdown Styling */
        h1 { color: var(--primary); font-size: 2.5rem; margin-bottom: 40px; }
        h2 { color: #fff; margin-top: 50px; border-left: 5px solid var(--primary); padding-left: 20px; }
        h3 { color: var(--primary); margin-top: 30px; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 30px 0;
            background: rgba(255,255,255,0.02);
            border-radius: 15px;
            overflow: hidden;
        }
        th, td {
            padding: 20px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th { background: rgba(255, 140, 0, 0.1); color: var(--primary); }
        tr:hover { background: rgba(255,255,255,0.05); }
        blockquote {
            border-radius: 15px;
            background: rgba(255, 140, 0, 0.05);
            border: 1px solid var(--primary);
            padding: 20px 30px;
            margin: 30px 0;
            color: #fff;
        }
        a { color: var(--primary); text-decoration: none; border-bottom: 1px dashed var(--primary); transition: 0.3s; }
        a:hover { background: var(--primary); color: #000; }
        img { max-width: 100%; border-radius: 20px; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="nav-header">
        <a href="index.html" class="back-btn">&larr; กลับหน้าหลัก Dashboard</a>
        <div style="font-weight: 700; color: var(--primary);">ACADEMIC REFERENCE 2026</div>
    </div>

    <div class="container">
        <div id="content">กำลังโหลดข้อมูล...</div>
    </div>

    <script>
        async function loadMarkdown() {
            try {
                const response = await fetch('comparison_matrix_th.md');
                const text = await response.text();
                document.getElementById('content').innerHTML = marked.parse(text);
            } catch (err) {
                document.getElementById('content').innerHTML = "ไม่พบไฟล์ข้อมูล หรือมีข้อผิดพลาดในการโหลด";
            }
        }
        loadMarkdown();
    </script>
</body>
</html>
