<!DOCTYPE html>
<html>
<head>
    <title>MindAR Compiler Helper</title>
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image.prod.js"></script>
</head>
<body>
    <div id="status">Initializing...</div>
    <script>
        const log = (msg) => {
            document.getElementById('status').innerText = msg;
            console.log(msg);
        };

        async function resizeImage(img, maxW = 600) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            let w = img.width;
            let h = img.height;
            if (w > maxW) {
                h = h * (maxW / w);
                w = maxW;
            }
            canvas.width = w;
            canvas.height = h;
            ctx.fillStyle = "#FFFFFF";
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            return canvas;
        }

        async function compile() {
            try {
                log("v1.1.6 - STACK FIX");
                log("Loading images...");
                const imagePaths = [
                    'ar_portal/assets/markers_to_compile/target1.png',
                    'ar_portal/assets/markers_to_compile/target2.png',
                    'ar_portal/assets/markers_to_compile/target3.png',
                    'ar_portal/assets/markers_to_compile/target4.png',
                    'ar_portal/assets/markers_to_compile/target5.png',
                    'ar_portal/assets/markers_to_compile/target6.png',
                    'ar_portal/assets/markers_to_compile/target7.png',
                    'ar_portal/assets/markers_to_compile/target8.png',
                    'ar_portal/assets/markers_to_compile/target9.png',
                    'ar_portal/assets/markers_to_compile/target10.png'
                ];

                const loadedImages = await Promise.all(imagePaths.map((path, index) => {
                    return new Promise((resolve, reject) => {
                        const img = new Image();
                        img.onload = () => resolve(img);
                        img.onerror = () => reject(new Error("Failed to load: " + path));
                        img.src = "../" + path;
                    });
                }));

                log("Optimizing images (600px)...");
                const resizedImages = await Promise.all(loadedImages.map(img => resizeImage(img, 600)));

                log("Phase: Core Compilation (Be patient)...");
                const compiler = new window.MINDAR.IMAGE.Compiler();
                await compiler.compileImageTargets(resizedImages, (progress) => {
                    log("Compiling... " + progress.toFixed(2) + "%");
                });

                log("Phase: Exporting buffer...");
                const buffer = await compiler.exportData();
                log("COMPILATION_COMPLETE");

                // SEAMLESS UPLOAD TO LOCAL SERVER
                log("Phase: Uploading to local workspace...");
                try {
                    const response = await fetch('http://localhost:9999', {
                        method: 'POST',
                        body: buffer
                    });
                    if (response.ok) {
                        log("DONE: Targets saved to /assets/targets/targets.mind");
                    } else {
                        throw new Error("Server rejected upload");
                    }
                } catch ( uploadErr ) {
                    log("UPLOAD FAILED - Please fallback to Console.");
                    console.error(uploadErr);
                    
                    // Fallback to Base64 in console
                    const uint8Array = new Uint8Array(buffer);
                    let binary = '';
                    const CHUNK_SIZE = 0x8000;
                    for (let i = 0; i < uint8Array.length; i += CHUNK_SIZE) {
                        binary += String.fromCharCode.apply(null, uint8Array.subarray(i, i + CHUNK_SIZE));
                    }
                    const base64 = btoa(binary);
                    console.log("BASE64_START");
                    console.log(base64);
                    console.log("BASE64_END");
                }
            } catch (err) {
                log("HALT - ERROR: " + err.message);
                console.error("Full Trace:", err);
            }
        }

        compile();
    </script>
</body>
</html>
