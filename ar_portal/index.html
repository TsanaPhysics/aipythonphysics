<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics xAI AR Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; background: #000; color: white; }
        #debug-console {
            position: absolute; top: 10px; left: 10px; right: 10px;
            background: rgba(0, 0, 0, 0.9); color: #00ffaa;
            font-family: monospace; font-size: 10px; padding: 10px;
            border-radius: 12px; z-index: 3000; max-height: 100px;
            overflow-y: auto; border: 1px solid #00ffaa33;
        }
        #camera-warning {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 2000;
        }
        .warning-card { background: #111; padding: 30px; border-radius: 20px; text-align: center; border: 1px solid #333; }
        .btn {
            background: #00ffaa; color: black; padding: 12px 24px; border-radius: 30px;
            border: none; font-weight: 600; margin-top: 20px; cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="debug-console">--- SURVIVOR LOG v1.0.8 ---</div>

    <div id="camera-warning">
        <div class="warning-card">
            <h2 style="color: #00ffaa;">AR Engine Starting</h2>
            <p id="load-status">Attempting to load high-performance scripts...</p>
            <button class="btn" onclick="location.reload()">Force Restart</button>
        </div>
    </div>

    <script>
        const log = (msg) => {
            const el = document.getElementById('debug-console');
            if (el) { el.innerHTML += `<br>> ${msg}`; el.scrollTop = el.scrollHeight; }
            console.log(msg);
        };

        const loadScript = (url, name) => {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = url;
                script.onload = () => { log(`SUCCESS: ${name}`); resolve(); };
                script.onerror = () => { log(`FAILED: ${name}`); reject(); };
                document.head.appendChild(script);
            });
        };

        async function boot() {
            log("v1.0.8 - Dynamic Triple-CDN Boot");
            
            // Try A-Frame
            const aframeSources = [
                'https://aframe.io/releases/1.2.0/aframe.min.js',
                'https://unpkg.com/aframe@1.2.0/dist/aframe-master.min.js',
                'https://cdn.jsdelivr.net/npm/aframe@1.2.0/dist/aframe-master.min.js'
            ];
            
            let aframeLoaded = false;
            for (const src of aframeSources) {
                try {
                    await loadScript(src, "AFRAME");
                    aframeLoaded = true;
                    break;
                } catch(e) {}
            }

            if (!aframeLoaded) { log("CRITICAL: All AFRAME sources failed"); return; }

            // Try MindAR
            const mindarSources = [
                'https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image-aframe.prod.js',
                'https://unpkg.com/mind-ar-js@1.1.4/dist/mindar-image-aframe.prod.js',
                'https://cdn.jsdelivr.net/npm/mind-ar-js@1.1.4/dist/mindar-image-aframe.prod.js'
            ];

            let mindarLoaded = false;
            for (const src of mindarSources) {
                try {
                    await loadScript(src, "MindAR");
                    mindarLoaded = true;
                    break;
                } catch(e) {}
            }

            if (!mindarLoaded) { log("CRITICAL: All MindAR sources failed"); return; }

            log("All systems GO. Starting Scene...");
            startScene();
        }

        function startScene() {
            const scene = document.createElement('a-scene');
            scene.setAttribute('mindar-image', 'imageTargetSrc: assets/targets/targets.mind; autoStart: true; uiLoading: no;');
            scene.setAttribute('vr-mode-ui', 'enabled: false');
            scene.setAttribute('embedded', '');
            
            scene.innerHTML = `
                <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
                <a-entity mindar-image-target="targetIndex: 0">
                    <a-sphere radius="0.1" color="#00ffaa"></a-sphere>
                </a-entity>
            `;

            scene.addEventListener('arReady', () => {
                log("AR READY: Tracking started!");
                document.getElementById('camera-warning').style.display = 'none';
            });

            document.body.appendChild(scene);
            
            // Asset Check
            fetch('assets/targets/targets.mind').then(r => log(`Asset targets.mind: ${r.status}`));
        }

        boot();
    </script>
</body>
</html>
