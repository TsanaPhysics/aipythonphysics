<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics xAI AR Portal</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image-aframe.prod.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; background: #000; }
        #ui-overlay {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 12px; z-index: 1000;
        }
        .btn {
            background: rgba(0, 0, 0, 0.85); color: white; border: 1px solid rgba(255,255,255,0.3);
            padding: 12px 24px; border-radius: 40px; cursor: pointer; backdrop-filter: blur(15px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); font-weight: 600; font-size: 13px;
            letter-spacing: 0.5px; text-transform: uppercase;
        }
        .btn:hover { background: #00ffcc; color: black; border-color: #00ffcc; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,255,204,0.3); }
        .btn.active { background: #00ffcc; color: black; border-color: #00ffcc; box-shadow: 0 0 15px rgba(0,255,204,0.5); }
        
        #scan-guide {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 70vw; height: 70vw; max-width: 300px; max-height: 300px;
            border: 2px dashed rgba(0, 255, 204, 0.5); border-radius: 40px;
            pointer-events: none; z-index: 500;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.05); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
        }

        #camera-warning {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 10, 0.98); color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; z-index: 2000; display: none; padding: 40px;
        }
        .warning-card {
            background: #1a1a1a; padding: 30px; border-radius: 24px; border: 1px solid #333;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <div id="camera-warning">
        <div class="warning-card">
            <h2 style="color: #ff3e3e; margin-bottom: 20px;">🔒 Security Block</h2>
            <p style="color: #aaa; line-height: 1.6;">Camera access is restricted to <b>HTTPS</b> or <b>Localhost</b>.</p>
            <p style="color: #00ffcc; margin: 20px 0;">Please use an HTTPS tunnel (ngrok) for mobile testing.</p>
            <button class="btn" onclick="location.reload()">Retry Connection</button>
        </div>
    </div>

    <div id="scan-guide"></div>
    
    <div id="ui-overlay">
        <button id="style-minimal-btn" class="btn active" onclick="setStyle('minimal')">Minimalist</button>
        <button id="style-scifi-btn" class="btn" onclick="setStyle('scifi')">High-Tech Sci-Fi</button>
        <button id="code-btn" class="btn" onclick="toggleCode()">Code View</button>
    </div>

    <!-- 
      AR Scene Configuration
      - All targets hidden by default.
      - Targets appear only when MindAR detects the corresponding image.
    -->
    <a-scene 
        mindar-image="imageTargetSrc: assets/targets/targets.mind; filterMinCF:0.0001; filterBeta: 0.1; uiLoading:no; uiScanning:no;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false"
        embedded>
        
        <a-assets></a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Chapter 1: Oscillator (Index 0) -->
        <a-entity mindar-image-target="targetIndex: 0">
            <a-entity class="chapter-content" id="ch1-minimal" position="-0.4 0 0">
                <a-sphere position="0 0 0" radius="0.08" color="#f39c12" animation="property: position; from: -0.2 0 0; to: 0.2 0 0; dir: alternate; dur: 2000; easing: easeInOutSine; loop: true"></a-sphere>
                <a-cylinder position="0 0.4 0" radius="0.005" height="0.8" color="#7f8c8d"></a-cylinder>
            </a-entity>
            <a-entity class="chapter-content" id="ch1-scifi" position="0.4 0 0" visible="false">
                <a-torus-knot position="0 0 0" radius="0.1" radius-tubular="0.015" color="#00ffcc" animation="property: rotation; to: 0 360 0; dur: 3000; loop: true"></a-torus-knot>
                <a-light type="point" color="#00ffcc" intensity="0.5"></a-light>
            </a-entity>
            <a-entity class="code-panel" id="ch1-code" visible="false" position="0 0.5 0" scale="0.4 0.4 0.4">
                <a-plane width="2" height="1" color="#1a1a1a" opacity="0.9">
                    <a-text value="Euler: v+=a*dt; x+=v*dt" align="center" width="2" color="#00ffcc"></a-text>
                </a-plane>
            </a-entity>
        </a-entity>

        <!-- Chapter 2: Planetary Orbit (Index 1) -->
        <a-entity mindar-image-target="targetIndex: 1">
            <a-entity class="chapter-content" id="ch2-minimal" position="-0.4 0 0">
                <a-sphere radius="0.1" color="#f1c40f"></a-sphere>
                <a-sphere position="0.25 0 0" radius="0.03" color="#3498db" animation="property: rotation; around: 0 0 0; to: 0 360 0; dur: 5000; loop: true; easing: linear"></a-sphere>
            </a-entity>
            <a-entity class="chapter-content" id="ch2-scifi" position="0.4 0 0" visible="false">
                <a-sphere radius="0.08" color="#000" wireframe="true">
                    <a-ring color="#00ffcc" radius-inner="0.25" radius-outer="0.26" rotation="-90 0 0"></a-ring>
                </a-sphere>
                <a-octahedron position="0.25 0 0" radius="0.03" color="#00ffcc" animation="property: rotation; to: 360 360 0; dur: 4000; loop: true"></a-octahedron>
            </a-entity>
            <a-entity class="code-panel" id="ch2-code" visible="false" position="0 0.5 0" scale="0.4 0.4 0.4">
                <a-plane width="2" height="1" color="#1a1a1a" opacity="0.9">
                    <a-text value="Orbit: F = G*M*m/r^2" align="center" width="2" color="#00ffcc"></a-text>
                </a-plane>
            </a-entity>
        </a-entity>

        <!-- Chapter 3: PINN Heat Flow (Index 2) -->
        <a-entity mindar-image-target="targetIndex: 2">
            <a-entity class="chapter-content" id="ch3-minimal" position="-0.4 0 0">
                <a-plane rotation="-90 0 0" width="0.6" height="0.6" color="#e67e22"></a-plane>
            </a-entity>
            <a-entity class="chapter-content" id="ch3-scifi" position="0.4 0 0" visible="false">
                <a-grid width="0.6" height="0.6" color="#00ffcc" wireframe="true"></a-grid>
            </a-entity>
            <a-entity class="code-panel" id="ch3-code" visible="false" position="0 0.5 0" scale="0.4 0.4 0.4">
                <a-plane width="2" height="1" color="#1a1a1a" opacity="0.9">
                    <a-text value="Loss = MSE_data + MSE_phys" align="center" width="2" color="#00ffcc"></a-text>
                </a-plane>
            </a-entity>
        </a-entity>

        <!-- Chapter 4: Ising Model (Index 3) -->
        <a-entity mindar-image-target="targetIndex: 3">
            <a-entity class="chapter-content" id="ch4-minimal" position="-0.4 0 0">
                <a-plane width="0.6" height="0.6" color="#34495e" rotation="-90 0 0"></a-plane>
            </a-entity>
            <a-entity class="chapter-content" id="ch4-scifi" position="0.4 0 0" visible="false">
                <a-box width="0.1" height="0.1" depth="0.1" color="#00ffcc" animation="property: rotation; to: 360 360 0; dur: 5000; loop: true"></a-box>
            </a-entity>
            <a-entity class="code-panel" id="ch4-code" visible="false" position="0 0.5 0" scale="0.4 0.4 0.4">
                <a-plane width="2" height="1" color="#1a1a1a" opacity="0.9">
                    <a-text value="P(s) = exp(-H/kT)\nH = -J Sigma(si*sj)" align="center" width="2" color="#00ffcc"></a-text>
                </a-plane>
            </a-entity>
        </a-entity>

        <!-- Chapter 5: HNN (Index 4) -->
        <a-entity mindar-image-target="targetIndex: 4">
            <a-entity class="chapter-content" id="ch5-minimal" position="-0.4 0 0">
                <a-ring radius-inner="0.2" radius-outer="0.21" color="#e74c3c"></a-ring>
            </a-entity>
            <a-entity class="chapter-content" id="ch5-scifi" position="0.4 0 0" visible="false">
                <a-torus radius="0.2" tube="0.005" color="#ff0066"></a-torus>
            </a-entity>
            <a-entity class="code-panel" id="ch5-code" visible="false" position="0 0.5 0" scale="0.4 0.4 0.4">
                <a-plane width="2" height="1" color="#1a1a1a" opacity="0.9">
                    <a-text value="H: dq/dt=dH/dp; dp/dt=-dH/dq" align="center" width="2" color="#00ffcc"></a-text>
                </a-plane>
            </a-entity>
        </a-entity>

        <!-- Chapter 6: DL Waves (Index 5) -->
        <a-entity mindar-image-target="targetIndex: 5">
            <a-entity class="chapter-content" id="ch6-minimal" position="-0.4 0 0">
                <a-box width="0.5" height="0.1" depth="0.5" color="#2ecc71"></a-box>
            </a-entity>
            <a-entity class="chapter-content" id="ch6-scifi" position="0.4 0 0" visible="false">
                <a-sphere radius="0.1" color="#00ffcc" wireframe="true" animation="property: scale; from: 1 1 1; to: 1.5 1.5 1.5; dur: 1000; loop: true; dir: alternate"></a-sphere>
            </a-entity>
            <a-entity class="code-panel" id="ch6-code" visible="false" position="0 0.5 0" scale="0.4 0.4 0.4">
                <a-plane width="2" height="1" color="#1a1a1a" opacity="0.9">
                    <a-text value="Conv1D: Signal -> Filter -> Map" align="center" width="2" color="#00ffcc"></a-text>
                </a-plane>
            </a-entity>
        </a-entity>

        <!-- Chapter 7: Rocket RL (Index 6) -->
        <a-entity mindar-image-target="targetIndex: 6">
            <a-entity class="chapter-content" id="ch7-minimal" position="-0.4 0 0">
                <a-cylinder radius="0.05" height="0.3" color="#95a5a6"></a-cylinder>
            </a-entity>
            <a-entity class="chapter-content" id="ch7-scifi" position="0.4 0 0" visible="false">
                <a-cone radius-bottom="0.05" height="0.3" color="#e74c3c" animation="property: position; from: 0 0 0; to: 0 0.5 0; dur: 2000; loop: true; dir: alternate"></a-cone>
            </a-entity>
            <a-entity class="code-panel" id="ch7-code" visible="false" position="0 0.5 0" scale="0.4 0.4 0.4">
                <a-plane width="2" height="1" color="#1a1a1a" opacity="0.9">
                    <a-text value="Reward = v_target - v_actual" align="center" width="2" color="#00ffcc"></a-text>
                </a-plane>
            </a-entity>
        </a-entity>

        <!-- Chapter 8: Multi-Objective (Index 7) -->
        <a-entity mindar-image-target="targetIndex: 7">
            <a-entity class="chapter-content" id="ch8-minimal" position="-0.4 0 0">
                <a-triangle color="#f39c12" vertex-c="0.5 0.5 0"></a-triangle>
            </a-entity>
            <a-entity class="chapter-content" id="ch8-scifi" position="0.4 0 0" visible="false">
                <a-icosahedron radius="0.1" color="#00ffcc" animation="property: rotation; to: 360 360 360; dur: 5000; loop: true"></a-icosahedron>
            </a-entity>
            <a-entity class="code-panel" id="ch8-code" visible="false" position="0 0.5 0" scale="0.4 0.4 0.4">
                <a-plane width="2" height="1" color="#1a1a1a" opacity="0.9">
                    <a-text value="Pareto: Optimize f1, f2..." align="center" width="2" color="#00ffcc"></a-text>
                </a-plane>
            </a-entity>
        </a-entity>

        <!-- Chapter 9: Latent Space (Index 8) -->
        <a-entity mindar-image-target="targetIndex: 8">
            <a-entity class="chapter-content" id="ch9-minimal" position="-0.4 0 0">
                <a-sphere radius="0.1" color="#3498db" opacity="0.5"></a-sphere>
            </a-entity>
            <a-entity class="chapter-content" id="ch9-scifi" position="0.4 0 0" visible="false">
                <a-torus radius="0.15" tube="0.01" color="#ff00ff" animation="property: rotation; to: 0 360 360; dur: 8000; loop: true"></a-torus>
            </a-entity>
            <a-entity class="code-panel" id="ch9-code" visible="false" position="0 0.5 0" scale="0.4 0.4 0.4">
                <a-plane width="2" height="1" color="#1a1a1a" opacity="0.9">
                    <a-text value="Latent: z = mu + sigma * epsilon" align="center" width="2" color="#00ffcc"></a-text>
                </a-plane>
            </a-entity>
        </a-entity>

        <!-- Chapter 10: GNN (Index 9) -->
        <a-entity mindar-image-target="targetIndex: 9">
            <a-entity class="chapter-content" id="ch10-minimal" position="-0.4 0 0">
                <a-sphere radius="0.08" color="#8e44ad"></a-sphere>
            </a-entity>
            <a-entity class="chapter-content" id="ch10-scifi" position="0.4 0 0" visible="false">
                <a-dodecahedron radius="0.1" color="#00ffcc" wireframe="true" animation="property: rotation; to: 360 360 360; dur: 10000; loop: true"></a-dodecahedron>
            </a-entity>
            <a-entity class="code-panel" id="ch10-code" visible="false" position="0 0.5 0" scale="0.4 0.4 0.4">
                <a-plane width="2" height="1" color="#1a1a1a" opacity="0.9">
                    <a-text value="GNN: xi = Agg(xj, eij)" align="center" width="2" color="#00ffcc"></a-text>
                </a-plane>
            </a-entity>
        </a-entity>

    </a-scene>

    <script>
        // Check for secure context (HTTPS)
        window.addEventListener('load', () => {
            if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost') {
                document.getElementById('camera-warning').style.display = 'flex';
            }
        });

        let codeVisible = false;
        let currentStyle = 'minimal';
        const chapters = ['ch1', 'ch2', 'ch3', 'ch4', 'ch5', 'ch6', 'ch7', 'ch8', 'ch9', 'ch10'];

        function setStyle(style) {
            currentStyle = style;
            document.getElementById('style-minimal-btn').classList.toggle('active', style === 'minimal');
            document.getElementById('style-scifi-btn').classList.toggle('active', style === 'scifi');
            
            chapters.forEach(chap => {
                const min = document.getElementById(`${chap}-minimal`);
                const sci = document.getElementById(`${chap}-scifi`);
                if(min) min.setAttribute('visible', style === 'minimal');
                if(sci) sci.setAttribute('visible', style === 'scifi');
            });
        }

        function toggleCode() {
            codeVisible = !codeVisible;
            chapters.forEach(chap => {
                const code = document.getElementById(`${chap}-code`);
                if(code) code.setAttribute('visible', codeVisible);
            });
            document.getElementById('code-btn').innerText = codeVisible ? "Hide Code" : "Show Code View";
            document.getElementById('code-btn').classList.toggle('active', codeVisible);
        }
    </script>
</body>
</html>
