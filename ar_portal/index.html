<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics xAI AR Portal</title>
    
    <script>
        const log = (msg) => {
            const el = document.getElementById('debug-console');
            if (el) {
                el.innerHTML += `<br>> ${msg}`;
                el.scrollTop = el.scrollHeight;
            }
            console.log(msg);
        };
    </script>

    <!-- v1.0.7 - Improved Script Load Watchers -->
    <script 
        src="https://unpkg.com/aframe@1.2.0/dist/aframe-master.min.js"
        onload="log('Load: AFRAME OK')"
        onerror="log('Load: AFRAME FAILED!')">
    </script>
    <script 
        src="https://unpkg.com/mind-ar-js@1.1.4/dist/mindar-image-aframe.prod.js"
        onload="log('Load: MindAR OK')"
        onerror="log('Load: MindAR FAILED!')">
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; background: #000; }
        #debug-console {
            position: absolute; top: 10px; left: 10px; right: 10px;
            background: rgba(0, 0, 0, 0.9); color: #00ffaa;
            font-family: monospace; font-size: 11px; padding: 12px;
            border-radius: 12px; z-index: 3000; max-height: 120px;
            overflow-y: auto; border: 1px solid #00ffaa33;
        }
        #ui-overlay {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 15px; z-index: 1000;
        }
        .btn {
            background: rgba(20, 20, 20, 0.9); color: white; border: 1px solid #444;
            padding: 14px 28px; border-radius: 50px; cursor: pointer;
            font-weight: 600; font-size: 14px;
        }
        .btn.active { background: #00ffaa; color: black; border-color: #00ffaa; }
        
        #camera-warning {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; z-index: 2000;
        }
        .warning-card { background: #111; padding: 40px; border-radius: 30px; border: 1px solid #222; }
    </style>
</head>
<body>
    <div id="debug-console">--- FINAL RECOVERY v1.0.7 ---</div>

    <div id="camera-warning">
        <div class="warning-card">
            <h2 id="status-title" style="color: #00ffaa; margin-bottom: 20px;">AR Engine</h2>
            <p id="status-desc" style="color: #888;">Synchronizing Assets...</p>
            <button class="btn" style="margin-top:20px;" onclick="location.reload()">Reset App</button>
        </div>
    </div>

    <div id="ui-overlay">
        <button id="style-minimal-btn" class="btn active" onclick="setStyle('minimal')">Style A</button>
        <button id="style-scifi-btn" class="btn" onclick="setStyle('scifi')">Style B</button>
    </div>

    <a-scene 
        mindar-image="imageTargetSrc: assets/targets/targets.mind; autoStart: true;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false"
        embedded>
        
        <script>
            log("v1.0.7 - Initializing App");

            const sceneEl = document.querySelector('a-scene');
            sceneEl.addEventListener("arReady", () => {
                log("STATE: AR Ready!");
                document.getElementById('camera-warning').style.display = 'none';
            });
            
            sceneEl.addEventListener("arError", (e) => {
                log(`STATE: AR Error - ${JSON.stringify(e.detail)}`);
            });

            fetch('assets/targets/targets.mind')
                .then(r => log(`Asset targets.mind: ${r.status}`))
                .catch(e => log(`Asset ERR: ${e.message}`));

            navigator.mediaDevices.getUserMedia({video: true})
                .then(() => log("Cam Access: OK"))
                .catch(e => log(`Cam Access: DENIED`));
            
            function setStyle(s) { log(`Style: ${s}`); }
        </script>

        <a-assets></a-assets>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-sphere radius="0.1" color="#f39c12"></a-sphere>
        </a-entity>
    </a-scene>
</body>
</html>
