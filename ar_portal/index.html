<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics xAI AR Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Scripts in Head with async to not block but ready before scene -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; background: #000; color: white; }
        #debug-console {
            position: absolute; top: 10px; left: 10px; right: 10px;
            background: rgba(0, 0, 0, 0.85); color: #00ffaa;
            font-family: monospace; font-size: 10px; padding: 12px;
            border-radius: 12px; z-index: 3000; max-height: 90px; overflow-y: auto;
            border: 1px solid #00ffaa33;
        }
        #startup-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 2000;
        }
        .main-card {
            background: #111; padding: 40px; border-radius: 30px;
            border: 1px solid #333; text-align: center; max-width: 85%;
        }
        .start-btn {
            background: #00ffaa; color: #000; padding: 22px 45px; border-radius: 50px;
            border: none; font-weight: 700; font-size: 18px; cursor: pointer;
            box-shadow: 0 0 30px rgba(0,255,170,0.5); display: none;
        }
        #scan-guide {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 75vw; height: 75vw; border: 2px dashed #00ffaa; border-radius: 40px;
            pointer-events: none; z-index: 1000; display: none; opacity: 0.5;
        }
    </style>
</head>
<body>
    <div id="debug-console">> Initializing System v1.1.0...</div>

    <div id="startup-overlay">
        <div class="main-card">
            <h1 style="color: #00ffaa; margin-bottom: 5px;">Physics xAI Portal</h1>
            <p id="status-msg" style="color: #888; margin-bottom: 30px;">Loading Core Modules...</p>
            <button id="start-btn" class="start-btn" onclick="startSystem()">ACTIVATE PORTAL</button>
        </div>
    </div>

    <div id="scan-guide"></div>

    <!-- Static Scene with autoStart: false -->
    <a-scene 
        id="ar-scene"
        mindar-image="imageTargetSrc: assets/targets/targets.mind; autoStart: false; uiLoading: no; uiScanning: no;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Chapter 1 -->
        <a-entity mindar-image-target="targetIndex: 0">
            <a-sphere radius="0.1" color="#f39c12"></a-sphere>
        </a-entity>
        
        <!-- Chapter 2-10 mapping... simplified for stability -->
        <a-entity mindar-image-target="targetIndex: 1"><a-sphere radius="0.1" color="#f1c40f"></a-sphere></a-entity>
        <a-entity mindar-image-target="targetIndex: 2"><a-box scale="0.15 0.15 0.15" color="#e67e22"></a-box></a-entity>
        <a-entity mindar-image-target="targetIndex: 3"><a-box scale="0.15 0.15 0.15" color="#34495e"></a-box></a-entity>
        <a-entity mindar-image-target="targetIndex: 4"><a-ring radius-inner="0.08" radius-outer="0.1" color="#e74c3c"></a-entity>
        <a-entity mindar-image-target="targetIndex: 5"><a-sphere radius="0.1" color="#2ecc71"></a-sphere></a-entity>
        <a-entity mindar-image-target="targetIndex: 6"><a-cylinder radius="0.05" height="0.2" color="#95a5a6"></a-entity>
        <a-entity mindar-image-target="targetIndex: 7"><a-pawn scale="0.1 0.1 0.1" color="#f39c12"></a-entity>
        <a-entity mindar-image-target="targetIndex: 8"><a-box scale="0.15 0.15 0.15" color="#3498db"></a-box></a-entity>
        <a-entity mindar-image-target="targetIndex: 9"><a-dodecahedron radius="0.1" color="#8e44ad"></a-dodecahedron></a-entity>

    </a-scene>

    <script>
        const log = (msg) => {
            const el = document.getElementById('debug-console');
            if (el) { el.innerHTML += `<br>> ${msg}`; el.scrollTop = el.scrollHeight; }
        };

        let systemInitialized = false;

        // Script loading verification
        window.addEventListener('error', (e) => log(`RUNTIME ERR: ${e.message}`));

        window.addEventListener('load', () => {
            log("v1.1.3 - CORE FIX");
            
            const sceneEl = document.querySelector('a-scene');
            const statusMsg = document.getElementById('status-msg');
            const startBtn = document.getElementById('start-btn');

            const initSystemCheck = () => {
                log("STATE: Initializing System Check...");
                
                const checkSystem = () => {
                    const arSystem = sceneEl.systems['mindar-image-system'];
                    if (arSystem) {
                        log("STATE: AR System Verified");
                        statusMsg.innerText = "Engine Ready. Tap to Start.";
                        startBtn.style.display = 'inline-block';
                        systemInitialized = true;
                    } else {
                        log("STATE: Waiting for AR Engine...");
                        setTimeout(checkSystem, 500); 
                    }
                };
                checkSystem();
            };

            // Handle both event and pre-loaded state
            if (sceneEl.hasLoaded) {
                log("STATE: Scene Already Loaded");
                initSystemCheck();
            } else {
                sceneEl.addEventListener('loaded', () => {
                    log("STATE: A-Frame Scene Loaded");
                    initSystemCheck();
                });
            }

            // Fallback for asset verification
            fetch('assets/targets/targets.mind').then(r => {
                log(`Asset Fetch: ${r.status}`);
            }).catch(e => log(`ERR: Fetch Failed: ${e.message}`));
        });

        function startSystem() {
            if (!systemInitialized) {
                log("WAIT: System still initializing...");
                return;
            }

            log("User Activate: Starting MindAR...");
            const sceneEl = document.querySelector('a-scene');
            const arSystem = sceneEl.systems['mindar-image-system'];
            
            if (arSystem) {
                try {
                    arSystem.start(); 
                    log("Signal Sent: Camera Booting");
                } catch (e) {
                    log(`ERR: Boot Failed: ${e.message}`);
                }
            } else {
                log("ERR: AR System disappeared!");
            }

            sceneEl.addEventListener('arReady', () => {
                log("STATE: AR Ready!");
                document.getElementById('startup-overlay').style.display = 'none';
                document.getElementById('scan-guide').style.display = 'block';
            });

            sceneEl.addEventListener('arError', (e) => {
                log(`ERR: AR Error: ${e.detail.error}`);
            });
        }
    </script>
</body>
</html>
