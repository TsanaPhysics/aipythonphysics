<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics xAI AR Portal</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.1/dist/mindar-image-aframe.prod.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; background: #000; }
        #debug-console {
            position: absolute; top: 10px; left: 10px; right: 10px;
            background: rgba(0, 0, 0, 0.8); color: #00ff66;
            font-family: monospace; font-size: 10px; padding: 10px;
            border-radius: 8px; z-index: 3000; max-height: 120px;
            overflow-y: auto; border: 1px solid #333;
        }
        #ui-overlay {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 12px; z-index: 1000;
        }
        .btn {
            background: rgba(0, 0, 0, 0.85); color: white; border: 1px solid rgba(255,255,255,0.3);
            padding: 12px 24px; border-radius: 40px; cursor: pointer; backdrop-filter: blur(15px);
            font-weight: 600; font-size: 13px;
        }
        .btn.active { background: #00ffcc; color: black; }
        
        #camera-warning {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 10, 0.98); color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; z-index: 2000; padding: 40px;
        }
        .warning-card { background: #1a1a1a; padding: 30px; border-radius: 24px; border: 1px solid #444; }
    </style>
</head>
<body>
    <div id="debug-console">--- ADVANCED DIAGNOSTICS v1.0.5 ---</div>

    <div id="camera-warning">
        <div class="warning-card">
            <h2 id="status-title" style="color: #00ffcc; margin-bottom: 20px;">AR Initialization</h2>
            <p id="status-desc" style="color: #aaa;">Wait while we verify WebGL and Assets...</p>
            <button class="btn" style="margin-top:20px;" onclick="location.reload()">Force Reload</button>
        </div>
    </div>

    <div id="ui-overlay">
        <button id="style-minimal-btn" class="btn active" onclick="setStyle('minimal')">Minimalist</button>
        <button id="style-scifi-btn" class="btn" onclick="setStyle('scifi')">Sci-Fi</button>
    </div>

    <a-scene 
        mindar-image="imageTargetSrc: assets/targets/targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <script>
            const log = (msg) => {
                const el = document.getElementById('debug-console');
                el.innerHTML += `<br>> ${msg}`;
                el.scrollTop = el.scrollHeight;
            };

            // 1. WebGL Check
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
                log(`WebGL Check: ${gl ? "OK (" + gl.getParameter(gl.VERSION) + ")" : "FAILED"}`);
            } catch(e) { log("WebGL ERR: " + e.message); }

            // 2. Fetch Check
            fetch('assets/targets/targets.mind')
                .then(r => log(`Asset Fetch: ${r.status}`))
                .catch(e => log(`Asset ERR: ${e.message}`));

            const sceneEl = document.querySelector('a-scene');
            
            sceneEl.addEventListener("arReady", () => {
                log("EVENT: arReady (Success!)");
                document.getElementById('camera-warning').style.display = 'none';
            });
            
            sceneEl.addEventListener("arError", (e) => {
                log(`EVENT: arError - ${JSON.stringify(e.detail)}`);
                document.getElementById('status-title').innerHTML = "❌ Library Error";
            });

            // 3. System Status Loop
            setInterval(() => {
                const system = sceneEl.systems['mindar-image-system'];
                if (system) {
                    // Check internal state if possible
                    if (system.el && system.el.getAttribute('mindar-image')) {
                         // MindAR is attached
                    }
                } else {
                    log("System: MindAR NOT detected yet...");
                }
            }, 2000);

            // Camera status
            navigator.mediaDevices.getUserMedia({video: true})
                .then(() => log("Camera API: OK"))
                .catch(e => log(`Camera API: DENIED (${e.name})`));

            function setStyle(style) {
                document.getElementById('style-minimal-btn').classList.toggle('active', style === 'minimal');
                document.getElementById('style-scifi-btn').classList.toggle('active', style === 'scifi');
                log(`Style: ${style}`);
            }
        </script>

        <a-assets></a-assets>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-sphere id="ch1-minimal" radius="0.1" color="#f39c12"></a-sphere>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 1">
            <a-sphere id="ch2-minimal" radius="0.1" color="#f1c40f"></a-sphere>
        </a-entity>
    </a-scene>
</body>
</html>
